name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            voice-v2/requirements.txt
            netshield-v2/requirements.txt
            student-nlq/requirements.txt
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev python3-tk
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r voice-v2/requirements.txt
          python -m pip install -r netshield-v2/requirements.txt
          python -m pip install -r student-nlq/requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q voice-v2 netshield-v2 student-nlq
      - name: Compile restaurant project
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only restaurant/main.cpp
